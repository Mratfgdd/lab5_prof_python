[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-student-importer"
version = "0.5.0"
description = "Laboratory work 5 (Professional Python): reliable import/export of student records"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
student-import = "reliable_importer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reliable_importer = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
